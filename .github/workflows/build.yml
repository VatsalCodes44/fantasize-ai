name: Build on push

on:
  push:
    branches: 
      - main

jobs:
  buildProject: 
    runs-on: ubuntu-latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with: 
          node-version: '23.10.0'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
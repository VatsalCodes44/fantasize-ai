name: Deploy

on:
  workflow_run:
    workflows: ["Build on push"]
    types:
      - completed

jobs: 
   build-and-push-to-dockerhub:
    runs-on: ubuntu-latest
    steps:
        - name: Check Out Repo
          uses: actions/checkout@v4
        
        - name: Prepare Dockerfile
          run: cp ./apps/web/Dockerfile ./Dockerfile

        - name: login to dockerhub
          uses: docker/login-action@v1
          with:
            username: ${{secrets.DOCKER_USERNAME}}
            password: ${{secrets.DOCKER_PASSWORD}}
        
        - name: Build and push to docker hub
          uses: docker/build-push-action@v2
          with: 
            context: .
            file: ./Dockerfile
            push: true
            tags: vatsalcodes44/fantasize-ai:latest
        
        - name: verify pushed image
          run: vatsalcodes44/fantasize-ai:latest

        - name: Deploy to EC2
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USERNAME }}
            key: ${{ secrets.SSH_KEY }}
            script: |
                sudo docker pull vatsalcodes44/fantasize-ai:latest
                sudo docker stop fantasize-ai || true
                sudo docker rm fantasize-ai || true
                sudo docker run -d --name fantasize-ai -p 3005:3000 vatsalcodes44/fantasize-ai:latest